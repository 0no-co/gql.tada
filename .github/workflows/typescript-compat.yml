name: TypeScript Compatibility

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - src/**
      - packages/**
      - examples/**
      - scripts/check-typescript-71-native-api.mjs
      - scripts/typescript-71-compat/**
      - .github/workflows/typescript-compat.yml
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TypeScript latest
            script: check:ts-latest
            experimental: false
          - name: TypeScript native preview
            script: check:tsgo
            experimental: true
          - name: TypeScript 7.1 native API
            script: check:ts-native-api
            experimental: false
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run compatibility check
        run: pnpm run ${{ matrix.script }}
